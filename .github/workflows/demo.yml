name: Demo typecheck and frame render

on:
  pull_request:
  push:
    branches:
      - main
      - feat/cluster-dag-motion-demo

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run check
      - name: Check topology trace
        run: npm run validate:geometry
      - name: Render a representative vector frame
        run: npm run still
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nanite-demo-still
          path: out/cover.png
          retention-days: 7
