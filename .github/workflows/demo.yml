name: Demo typecheck and frame render

on:
  pull_request:
  push:
    branches:
      - main
      - feat/cluster-dag-motion-demo

concurrency:
  group: episode01-keyframes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chinese typography
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run check
      - name: Check topology trace
        run: npm run validate:geometry
      - name: Validate independently editable opening shot timeline
        run: npm run validate:chapter01-timeline
      - name: Render empty opening and narration caption
        run: npm run still:episode01-opening
      - name: Validate traditional LOD model and camera selection
        run: npm run validate:traditional-lod
      - name: Render traditional LOD versions
        run: npm run still:episode01-versions
      - name: Render camera and highlighted LOD list
        run: npm run still:episode01-camera-lod
      - name: Render whole-mesh limitation transition
        run: npm run still:episode01-wall
      - name: Render screen-pixel intuition
        run: npm run still:episode01-pixels
      - name: Validate Episode 01 mesh LOD boundaries and triangle counts
        run: npm run validate:episode01
      - name: Render a representative vector frame
        run: npm run still
      - name: Validate Episode 01 Triangle Adjacency Graph and partitions
        run: npm run validate:chapter02
      - name: Render Episode 01 Triangle Graph frame
        run: npm run still:episode01-graph
      - name: Render Episode 01 compact partition frame
        run: npm run still:episode01-partition
      - name: Validate Episode 01 Group / DAG hierarchy and LOD bounds
        run: npm run validate:hierarchy
      - name: Render Group simplification scene
        run: npm run still:episode01-group
      - name: Validate multilevel DAG cut invariants
        run: npm run validate:dag-cut
      - name: Render multilevel DAG cut
        run: npm run still:episode01-multilevel-dag
      - name: Render DAG scene
        run: npm run still:episode01-dag
      - name: Render Error and Bounds scene
        run: npm run still:episode01-error
      - name: Render final Runtime bridge scene
        run: npm run still:episode01-runtime
      - name: Render Episode 01 local geometry frame
        run: npm run still:episode01-local
      - name: Render Episode 01 cluster boundary frame
        run: npm run still:episode01
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nanite-video-geometry-stills
          path: |
            out/cover.png
            out/episode-01-opening.png
            out/episode-01-lod-versions.png
            out/episode-01-camera-lod.png
            out/episode-01-wall-transition.png
            out/episode-01-pixel-grid.png
            out/episode-01-local-lod.png
            out/episode-01-clusters.png
            out/episode-01-graph.png
            out/episode-01-partition.png
            out/episode-01-group.png
            out/episode-01-dag.png
            out/episode-01-multilevel-dag.png
            out/episode-01-error.png
            out/episode-01-runtime.png
          retention-days: 7
